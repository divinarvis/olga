<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIVINARVIS V8.11 - OLGA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:20px;min-height:100vh}
h1{color:#ff2a6d;text-align:center;margin:20px 0;font-size:28px}
.card{background:#1a1a1a;border-radius:12px;padding:20px;margin:15px auto;max-width:600px;border:1px solid #333}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;margin:8px 0}
button{width:100%;padding:12px;border-radius:8px;border:0;background:#ff2a6d;color:#fff;font-weight:700;cursor:pointer;margin:8px 0}
button:hover{background:#ff4a8d}
.file{background:#222;padding:12px;border-radius:8px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
audio{width:100%;margin-top:15px}
.small{font-size:12px;color:#888;text-align:center;margin-top:20px}
</style>
</head>
<body>
<h1>DIVINARVIS V8.11</h1>
<div class="card">
<h3>📁 Upload Audio</h3>
<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.mp4,.wav">
<button onclick="uploadFile()">Uploader</button>
</div>
<div class="card">
<h3>📺 YouTube</h3>
<input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
<button onclick="downloadYT()">Télécharger YouTube</button>
<div id="ytStatus" style="margin-top:10px;color:#0f0"></div>
</div>
<div class="card">
<h3>🎵 Fichiers</h3>
<div id="fileList">Chargement...</div>
<audio id="player" controls></audio>
</div>
<div class="small" id="status">Serveur OK - olga-sfbp.onrender.com</div>
<script>
async function loadFiles(){
 const r=await fetch('/api/files'); const files=await r.json();
 const list=document.getElementById('fileList');
 if(!files.length){list.innerHTML='<div style=color:#888>Aucun fichier</div>';return}
 list.innerHTML=files.map(f=>`<div class=file><span>${f.name}</span><div><button style=width:auto;padding:6px 12px;margin:0 4px onclick="playFile('${f.url}')">▶️</button><button style=width:auto;padding:6px 12px;background:#333;margin:0 4px onclick="deleteFile('${f.name}')">🗑️</button></div></div>`).join('');
}
function playFile(url){document.getElementById('player').src=url;document.getElementById('player').play()}
async function uploadFile(){
 const inp=document.getElementById('fileInput'); if(!inp.files[0]){alert('Choisis un fichier');return}
 const fd=new FormData(); fd.append('file',inp.files[0]);
 document.getElementById('status').textContent='Upload...';
 const r=await fetch('/api/upload',{method:'POST',body:fd}); const j=await r.json();
 document.getElementById('status').textContent=j.ok?'Upload OK':'Erreur';
 loadFiles();
}
async function downloadYT(){
 const url=document.getElementById('ytUrl').value; if(!url){alert('Colle URL');return}
 document.getElementById('ytStatus').textContent='Téléchargement YouTube... 30s';
 const r=await fetch('/api/youtube',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
 const j=await r.json();
 document.getElementById('ytStatus').textContent=j.ok?'OK: '+j.title:'Erreur: '+(j.error||'');
 loadFiles();
}
async function deleteFile(name){
 if(!confirm('Supprimer '+name+'?'))return;
 await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
 loadFiles();
}
loadFiles();
</script>
</body>
</html>
